name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pandas streamlit sqlalchemy psycopg2-binary python-dotenv requests

      - name: Lint with ruff
        run: ruff check src/ tests/ || true

      - name: Run pytest
        run: pytest tests/ -v

  yaml-validation:
    name: YAML files valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Check dbt project YAML
        run: python -c "import yaml; yaml.safe_load(open('dbt/bundesliga_analytics/dbt_project.yml'))"